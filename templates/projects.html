    <script>
        // --- Test Data ---
        const testProjectData = [
            {
                repo: "my-pygame",
                deploymentName: "Snake Game v1.2",
                description: "Classic snake game implementation using Pygame compiled to WASM.",
                imageUrl: null, // Placeholder for image upload feature
                runLink: "https://example.com/run/snake-v1.2"
            },
            {
                repo: "web-utils",
                deploymentName: "Image Resizer",
                description: "A simple utility to resize images directly in the browser.",
                imageUrl: null,
                runLink: "https://example.com/run/resizer"
            },
            {
                repo: "my-pygame",
                deploymentName: "Platformer Demo",
                description: "Work in progress platformer game engine.",
                imageUrl: null,
                runLink: "https://example.com/run/platformer-dev"
            }
        ];

        // --- DOM Elements ---
        const projectsGrid = document.getElementById('projectsGrid');

        // --- Render Function ---
        function renderProjects(projects) {
            projectsGrid.innerHTML = ''; // Clear existing grid content

            // Generate project cards from data
            projects.forEach(project => {
                const card = document.createElement('div');
                card.classList.add('project-card');

                const runLinkHtml = project.runLink ? `<a href="${project.runLink}" target="_blank">${project.runLink.replace('https://','')}</a>` : 'Not Deployed';

                card.innerHTML = `
                    <button class="reveal-button">
                        <i class="fas fa-cog project-settings-icon"></i>
                    </button>
                    <div class="card-header">
                        <span class="project-repo">${project.repo} /</span>
                        <span class="deployment-name">${project.deploymentName || '[No Name]'}</span>
                    </div>
                    <div class="card-image-upload">
                        <i class="fas fa-image"></i> <!-- Placeholder icon -->
                        <span>Upload Image +</span>
                    </div>
                    <div class="card-description">
                        ${project.description || 'No Description.'}
                    </div>
                    <div class="card-run-link">
                        Run at | ${runLinkHtml}
                    </div>
                `;
                projectsGrid.appendChild(card);
            });

            // Add the "Deploy New Project" card
            const addCard = document.createElement('div');
            addCard.classList.add('project-card', 'add-new');
            addCard.id = 'addNewProjectBtn'; // Add ID for click listener
            addCard.innerHTML = `
                <i class="fas fa-plus-circle"></i> <!-- Use plus icon -->
                <p>Deploy New Project</p>
            `;
            projectsGrid.appendChild(addCard);

            // Add event listener AFTER the element is created
            const addNewButton = document.getElementById('addNewProjectBtn');
            if (addNewButton) {
                addNewButton.addEventListener('click', () => {
                    console.log("Add New Project card clicked - Simulating switch to Deploy screen.");
                    // In a real scenario, you would navigate:
                    window.location.href = "{{ url_for('deploy_page') }}"; // Or use a router
                });
            }
        }

        // --- Initial Render ---
        document.addEventListener('DOMContentLoaded', () => {
            renderProjects(testProjectData);
        });

    </script>
